name: CI RadarEntreprise

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff

      - name: Contrôle qualité Python (Linter Ruff)
        run: ruff check src/

      - name: Create data directory for DuckDB
        run: mkdir -p radar_dbt_project/data

      - name: Compilation dbt
        working-directory: ./radar_dbt_project
        run: dbt compile

      - name: Exécution des tests unitaires Python
        run: pytest --ignore=radar_dbt_project