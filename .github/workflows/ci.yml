name: CI RadarEntreprise

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff

      - name: Contrôle qualité Python (Linter Ruff)
        run: |
          # Vérifie la syntaxe et la propreté du code Python dans src/
          ruff check src/

      - name: Create data directory for DuckDB
        run: mkdir -p radar_dbt_project/data

      - name: Run dbt run
        working-directory: ./radar_dbt_project
        run: dbt run --vars '{"target_siren": "123456789"}' 

      - name: Validation, compilation et tests dbt (DuckDB)
        working-directory: ./radar_dbt_project
        run: |
          # Test de la syntaxe, compilation et tests des modèles dbt
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .
          dbt test --profiles-dir . --vars '{"target_siren": "123456789"}'

      - name: Exécution des tests unitaires Python
        run: |
          # Lance les tests unitaires s'il y en a
          pytest --ignore=radar_dbt_project